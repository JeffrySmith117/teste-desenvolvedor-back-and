name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Testes e padrão de código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, zip, intl
          coverage: none

      - name: Instala dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepara o ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verifica padrão de código (Pint)
        run: vendor/bin/pint --test

      - name: Roda os testes
        run: php artisan test

  docker:
    name: Ambiente Docker
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Sobe os containers
        run: docker compose up -d --build

      - name: Aguarda a aplicação responder
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/login > /dev/null; then
              echo "Aplicação no ar."
              exit 0
            fi
            sleep 5
          done
          echo "A aplicação não respondeu a tempo."
          exit 1

      - name: Testa o login da API
        run: |
          curl -fsS -X POST http://localhost:8080/api/login \
            -H "Accept: application/json" \
            -d "email=admin@example.com&password=password"

      - name: Logs dos containers
        if: always()
        run: docker compose logs

      - name: Derruba os containers
        if: always()
        run: docker compose down -v